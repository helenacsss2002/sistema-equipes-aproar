name: Diagnostico HTTP APROAR (sem deploy)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnostico-http-aproar.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Medir resposta dos endpoints (sem dados nem credenciais reais)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          targets = [
            ("worker-health", "GET", "https://sistema-equipes-aproar.helenacsss2002.workers.dev/api/health", None),
            ("worker-login-invalid-password", "POST", "https://sistema-equipes-aproar.helenacsss2002.workers.dev/api/login", {"role":"SUPERVISOR","supervisor":"EDUARDO","password":"DIAGNOSTICO_TESTE_SEM_SENHA_REAL_2026"}),
            ("portal-home", "GET", "https://apontamentosaproar.ct.ws/", None),
            ("portal-api-health", "GET", "https://apontamentosaproar.ct.ws/api/health", None),
          ]
          for label, method, url, payload in targets:
            data=json.dumps(payload).encode() if payload is not None else None
            headers={"User-Agent":"APROAR-Diagnostic/1.0"}
            if data is not None: headers.update({"Origin":"https://sistema-equipes-aproar.helenacsss2002.workers.dev","Content-Type":"application/json"})
            req=urllib.request.Request(url,data=data,headers=headers,method=method)
            try:
              with urllib.request.urlopen(req,timeout=12) as resp:
                raw=resp.read(350).decode("utf-8","replace")
                print(label, "HTTP",resp.status,"Content-Type:",resp.headers.get("Content-Type"), "Body:",raw.replace("\\n"," ")[:350])
            except urllib.error.HTTPError as ex:
              raw=ex.read(350).decode("utf-8","replace")
              print(label,"HTTP",ex.code,"Content-Type:",ex.headers.get("Content-Type"),"Body:",raw.replace("\\n"," ")[:350])
            except Exception as ex:
              print(label,"ERROR",type(ex).__name__,str(ex)[:220])
          PY
