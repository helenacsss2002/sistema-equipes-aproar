name: Validar versão mínima APROAR (sem deploy)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/aproar-preview-interunidades.yml']

permissions:
  contents: read

concurrency:
  group: aproar-versao-preview-interunidades
  cancel-in-progress: false

jobs:
  validar-e-carregar-versao:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar fontes atuais e proteções
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-production/public/app.js
          node --check cloudflare-production/worker.js
          node --test tests/test_apontamento_servicos_interunidades.mjs
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('cloudflare-production/wrangler.jsonc','utf8'));
          if(c.name!=='sistema-equipes-aproar'||c.assets?.binding!=='ASSETS'||c.assets?.directory!=='./public'||c.assets?.run_worker_first!==true||c.keep_vars!==true) throw Error('Configuração de produção sem todos os assets/segredos.');
          const js=fs.readFileSync('cloudflare-production/public/app.js','utf8');
          if(!js.includes('Obra / Serviço adicional')||!js.includes('allocationWorkLabel')||!js.includes('const additional=index>0')) throw Error('Interface incorreta.');
          const w=fs.readFileSync('cloudflare-production/worker.js','utf8');
          if(!w.includes('ss2.some((s) => !works.has(s.obraId))')||w.includes('works.get(s.obraId).unidade !== c.unidade')) throw Error('Validação do backend não liberou serviços de outras unidades.');
          const files=['index.html','app.js','pdf-lib.min.js','financeiro-consolidado.js','construction-background-hq.webp','aproar-favicon.ico'];
          for(const f of files)if(!fs.existsSync('cloudflare-production/public/'+f))throw Error('Faltando asset: '+f);
          console.log('OK: todos os arquivos reais da interface e controles foram preservados.');
          NODE
      - name: Fazer upload apenas de nova VERSÃO, sem deploy em produção
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          export CI=true
          npx --yes wrangler@4 versions upload --config cloudflare-production/wrangler.jsonc --keep-vars 2>&1 | tee /tmp/aproar-preview-upload.log
          echo 'Upload de versão concluído. NENHUM deploy realizado.'
