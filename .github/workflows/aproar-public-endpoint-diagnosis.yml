name: APROAR public endpoint diagnosis (non-production)
on:
  push:
    branches:
      - diagnostico/http-aproar-20261103
  workflow_dispatch:
jobs:
  check-public-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check APROAR public homepage and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          URL="https://sistema-equipes-aproar.helenacsss2002.workers.dev"
          for path in / /app.js /api/session; do
            echo "Checking $URL$path"
            result=$(curl -sS -L --connect-timeout 10 --max-time 20 -o /tmp/aproar-body -w 'http=%{http_code} dns=%{time_namelookup} tls=%{time_appconnect} total=%{time_total} bytes=%{size_download}' "$URL$path") || {
              echo "FAIL: network/TLS/DNS error for $path"
              exit 1
            }
            echo "$result"
            if [ "$path" = / ]; then
              echo "$result" | grep -q 'http=200' || { echo "FAIL: root is not HTTP 200"; exit 1; }
              grep -qi 'APROAR' /tmp/aproar-body || { echo "FAIL: expected APROAR branding missing"; exit 1; }
            fi
            if [ "$path" = /app.js ]; then
              echo "$result" | grep -q 'http=200' || { echo "FAIL: app.js missing"; exit 1; }
              grep -q 'function' /tmp/aproar-body || { echo "FAIL: JS content invalid/empty"; exit 1; }
            fi
          done
          echo "OK: APROAR homepage and app.js are reachable from GitHub Actions"
