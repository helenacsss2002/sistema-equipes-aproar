name: Capturar interface ativa APROAR para correção isolada

on:
  push:
    branches: [main]
    paths: ['.github/workflows/capturar-interface-ativa-aproar.yml']

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/apontamento-rateio-interunidades-interface-real-20261117
          persist-credentials: true
      - name: Fazer cópia da interface efetivamente publicada sem tocar no Worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloudflare-production/public
          python3 - <<'PY'
          import urllib.request, pathlib
          root='https://sistema-equipes-aproar.helenacsss2002.workers.dev'
          files=['index.html','app.js','financeiro-consolidado.js','pdf-lib.min.js']
          dest=pathlib.Path('cloudflare-production/public')
          for name in files:
              req=urllib.request.Request(root+'/'+name,headers={'User-Agent':'APROAR-Source-Backup/1.0'})
              with urllib.request.urlopen(req,timeout=35) as f:
                  content=f.read()
                  ct=f.headers.get('Content-Type','')
              assert len(content)>1000, (name,'size unexpected',len(content))
              assert b'Interface ainda' not in content
              if name=='app.js':
                  assert b'function allocationRow' in content
                  assert b'Obra / Servi' in content
              if name=='index.html':
                  assert b'APROAR' in content
              (dest/name).write_bytes(content)
              print(name,len(content),ct)
          PY
          git config user.name 'APROAR Source Backup'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-production/public
          if ! git diff --cached --quiet; then
            git commit -m "backup: capturar assets reais de producao antes da correção"
            git push origin HEAD:fix/apontamento-rateio-interunidades-interface-real-20261117
          fi
