name: Validar e publicar APROAR (Cloudflare produção)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aproar-cloudflare-producao
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Checar sintaxe do Worker
        run: node --check cloudflare-production/worker.js
      - name: Testar as regras da produção
        run: node cloudflare-production/test-worker.mjs
      - name: Bloquear destino ou configuração errados
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('cloudflare-production/wrangler.jsonc','utf8'));
          if(c.name!=='sistema-equipes-aproar'||c.main!=='worker.js'||c.keep_vars!==true||c.no_bundle!==true||c.workers_dev!==true)throw Error('Configuração de produção insegura.');
          if(c.vars||c.route||c.routes||c.assets)throw Error('Variáveis, rotas e assets devem permanecer gerenciados pelo Cloudflare.');
          const s=fs.readFileSync('cloudflare-production/worker.js','utf8');
          if(!s.includes('PRODUCTION_WRITE_APPROVED')||!s.includes('PRODUCTION_EXPECTED_HOST')||!s.includes('async scheduled(event, env, ctx)'))throw Error('Worker sem as proteções esperadas.');
          NODE

  publicar:
    needs: validar
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Conferir presença dos Secrets do Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Token Cloudflare não configurado'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'ID de conta Cloudflare não configurado'; exit 1; }
      - name: Publicar exclusivamente sistema-equipes-aproar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config cloudflare-production/wrangler.jsonc --no-bundle --keep-vars
      - name: Conferir resposta pública sem alterar dados
        shell: bash
        run: |
          curl --retry 3 --retry-delay 2 --fail --silent --show-error \
            https://sistema-equipes-aproar.helenacsss2002.workers.dev/api/health \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(x.application!=='APROAR'||x.stage!=='producao'||x.writesEnabled!==true)process.exit(1);console.log('APROAR em produção: endpoint de saúde respondeu corretamente.');});"
