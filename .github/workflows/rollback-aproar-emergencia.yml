name: RESTAURAR APROAR - versao anterior 5a391807

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rollback-aproar-emergencia.yml"

permissions:
  contents: read

concurrency:
  group: aproar-cloudflare-producao
  cancel-in-progress: false

jobs:
  restaurar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Conferir acesso Cloudflare e localizar versao boa
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 versions list --name sistema-equipes-aproar --json > /tmp/aproar-versions.json
          TARGET="$(node -e "const s=require('fs').readFileSync('/tmp/aproar-versions.json','utf8');const m=s.match(/\\b5a391807-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\\b/i);if(!m)process.exit(1);console.log(m[0])")"
          test -n "$TARGET" || { echo "Versao anterior nao encontrada; nao fazer rollback incerto."; exit 1; }
          echo "APROAR_ROLLBACK_TARGET=$TARGET" >> "$GITHUB_ENV"
      - name: Restaurar 100 por cento da versao anterior
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 rollback "$APROAR_ROLLBACK_TARGET" --name sistema-equipes-aproar --message "ROLLBACK EMERGENCIAL: restaurar versao anterior 5a391807"
      - name: Confirmar estado sem alterar dados
        run: |
          curl --retry 3 --retry-delay 2 --fail --silent --show-error "https://sistema-equipes-aproar.helenacsss2002.workers.dev/api/health" | head -c 600
