name: Diagnostico carregamento APROAR sem dados

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostico-bootstrap-aproar.yml']

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verificar endpoint bootstrap sem expor dados
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, http.cookiejar, json, time
          root='https://sistema-equipes-aproar.helenacsss2002.workers.dev'
          jar=http.cookiejar.CookieJar()
          client=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          url=root+'/api/login'
          payload=json.dumps({'role':'VISUALIZAR','password':''}).encode()
          req=urllib.request.Request(url,data=payload,headers={'Origin':root,'Content-Type':'application/json'},method='POST')
          try:
            with client.open(req,timeout=20) as r:
              print('LOGIN_VIEWER_STATUS',r.status,'CONTENT_TYPE',r.headers.get('Content-Type'),'COOKIE_COUNT',len(jar))
          except urllib.error.HTTPError as e:
            print('LOGIN_VIEWER_STATUS',e.code,'CONTENT_TYPE',e.headers.get('Content-Type'))
            raise SystemExit(0)
          except Exception as e:
            print('LOGIN_VIEWER_ERROR',type(e).__name__)
            raise SystemExit(0)
          request=urllib.request.Request(root+'/api/bootstrap',headers={'Accept':'application/json'},method='GET')
          start=time.monotonic()
          try:
            with client.open(request,timeout=40) as r:
              buf=r.read()
              print('BOOTSTRAP_STATUS',r.status,'CONTENT_TYPE',r.headers.get('Content-Type'),'BYTES',len(buf),'SECONDS',round(time.monotonic()-start,2))
          except urllib.error.HTTPError as e:
            print('BOOTSTRAP_STATUS',e.code,'CONTENT_TYPE',e.headers.get('Content-Type'),'SECONDS',round(time.monotonic()-start,2))
          except Exception as e:
            print('BOOTSTRAP_ERROR',type(e).__name__,'SECONDS',round(time.monotonic()-start,2))
          PY
