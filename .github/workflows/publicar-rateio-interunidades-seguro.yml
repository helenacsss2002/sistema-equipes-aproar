name: Publicar APROAR com verificacao e rollback automatico

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-rateio-interunidades-seguro.yml']

permissions:
  contents: read

concurrency:
  group: aproar-cloudflare-producao
  cancel-in-progress: false

jobs:
  deploy-seguro:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validar e publicar com reversao automatica caso login falhe
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,time,sys
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          assert account and token, 'Credenciais Cloudflare do GitHub ausentes.'
          script='sistema-equipes-aproar'
          old='5a391807-2dbe-4411-87e0-a8dc977682a6'
          new='32929c99-4821-4d97-890f-5097c7c9afbf'
          root='/accounts/'+account+'/workers/scripts/'+script
          origin='https://sistema-equipes-aproar.helenacsss2002.workers.dev'
          def api(path,method='GET',payload=None):
            body=json.dumps(payload).encode() if payload is not None else None
            req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,data=body,method=method,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','User-Agent':'APROAR-Safe-Deployment/1.0'})
            with urllib.request.urlopen(req,timeout=25) as r:result=json.load(r)
            if not result.get('success'):raise RuntimeError('Cloudflare API recusou operacao '+path)
            return result['result']
          def active():
            return api(root+'/deployments?per_page=1')['deployments'][0]['versions']
          def set_version(version,reason):
            return api(root+'/deployments','POST',{'strategy':'percentage','versions':[{'version_id':version,'percentage':100}],'annotations':{'workers/message':reason}})
          assert active()==[{'version_id':old,'percentage':100}], 'Versao em producao inesperada: bloqueando implantacao.'
          deployed=False
          try:
            print('Iniciando publicacao de APROAR com arquivos estaticos preservados...')
            set_version(new,'Rateio interunidades de servicos adicionais; login e assets validados antes da liberacao definitiva')
            deployed=True
            assert active()==[{'version_id':new,'percentage':100}], 'Falha na ativacao da versao nova.'
            expected=['/','/app.js?v=aproar-rateio-interunidades-20261117-1','/financeiro-consolidado.js','/pdf-lib.min.js','/construction-background-hq.webp','/aproar-favicon.ico','/api/health']
            for path in expected:
              req=urllib.request.Request(origin+path,headers={'User-Agent':'APROAR-Production-Smoke-Test/1.0'})
              with urllib.request.urlopen(req,timeout=12) as r:
                b=r.read()
                if r.status!=200 or len(b)<8:raise RuntimeError('Asset com resposta invalida: '+path)
              if path=='/' and b'apoar-rateio' in b:pass
              if path=='/' and b'apoar-rateio' not in b and b'aproar-rateio-interunidades-20261117-1' not in b:raise RuntimeError('HTML da nova versao nao encontrado')
              if path.startswith('/app.js') and b'function allocationWorkLabel' not in b:raise RuntimeError('JavaScript novo nao carregou')
              if path=='/api/health':
                d=json.loads(b)
                if d.get('application')!='APROAR' or d.get('stage')!='producao' or d.get('databaseConfigured') is not True or d.get('writesEnabled') is not True:raise RuntimeError('API/gravacao nao validas')
              print('HTTP GET OK:',path)
            payload=json.dumps({'role':'SUPERVISOR','supervisor':'JOEL','password':'TESTE_SEM_SENHA_REAL_NAO_AUTENTICA'}).encode()
            req=urllib.request.Request(origin+'/api/login',data=payload,method='POST',headers={'Origin':origin,'Content-Type':'application/json','User-Agent':'APROAR-Production-Smoke-Test/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                raise RuntimeError('Login falso nao foi rejeitado, status '+str(r.status))
            except urllib.error.HTTPError as e:
              response=e.read(500)
              print('LOGIN_HTTP',e.code,'CONTENT_TYPE',e.headers.get('content-type'))
              if e.code!=401 or 'json' not in e.headers.get('content-type','').lower():raise RuntimeError('Login do supervisor nao chegou corretamente ao backend: '+str(e.code))
            if active()!=[{'version_id':new,'percentage':100}]:raise RuntimeError('Deployment alterado durante testes')
            print('APROAR_PRODUCTION_DEPLOY_VERIFIED',new)
          except Exception as err:
            print('ERRO NO SMOKE TEST: voltando a versao anterior.',type(err).__name__,str(err)[:300])
            if deployed:
              try:
                set_version(old,'ROLLBACK AUTOMATICO: teste de producao falhou, mantendo dados preservados')
                print('ROLLBACK_CONFIRMADO',active())
              except Exception as rollback_error:
                print('ERRO_CRITICO_ROLLBACK',type(rollback_error).__name__,str(rollback_error)[:250])
            raise
          PY
