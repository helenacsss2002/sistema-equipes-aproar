name: APROAR read-only production comparison

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Full 40-character GitHub commit SHA to compare with active production
        required: true
        type: string
        default: a8865738902d3dbaa5a9b001b75532c7878f1e70
  push:
    branches:
      - codex/djoune-preservar-producao-20261116
      - codex/corrigir-salvamento-conexao-20261116
    paths:
      - 'cloudflare/**'
      - '.github/workflows/aproar-cloudflare-audit.yml'

permissions:
  contents: read

concurrency:
  group: aproar-production-read-only-audit
  cancel-in-progress: false

jobs:
  compare-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APROAR_BASELINE_SHA: ${{ inputs.baseline_ref || 'a8865738902d3dbaa5a9b001b75532c7878f1e70' }}
    steps:
      - name: Check out the review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate the explicit baseline SHA before checkout
        run: |
          if [[ ! "$APROAR_BASELINE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo 'The production baseline must be a full 40-character commit SHA.'
            exit 1
          fi

      - name: Check out the explicit production baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APROAR_BASELINE_SHA }}
          path: .audit-baseline
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .audit-baseline/cloudflare/package-lock.json

      - name: Verify the baseline revision and install its locked build tools
        working-directory: .audit-baseline/cloudflare
        run: |
          test "$(git rev-parse HEAD)" = "${APROAR_BASELINE_SHA,,}"
          npm ci

      - name: Build the baseline locally without deploying or using Cloudflare credentials
        working-directory: .audit-baseline/cloudflare
        env:
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_LOG_PATH: ${{ runner.temp }}/aproar-audit-build.log
        run: node node_modules/wrangler/bin/wrangler.js deploy --dry-run --outdir "${{ runner.temp }}/aproar-audit-bundle" --config wrangler.jsonc

      - name: Compare active Worker, assets and required configuration using GET requests only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APROAR_BASELINE_ROOT: ${{ github.workspace }}/.audit-baseline
          APROAR_BASELINE_BUNDLE: ${{ runner.temp }}/aproar-audit-bundle
        run: node cloudflare/scripts/audit-production.mjs
