name: APROAR Cloudflare production deploy

on:
  push:
    branches:
      - aproar-html-validacao-cloudflare-20261008
    paths:
      - 'cloudflare/**'
      - '.github/workflows/aproar-cloudflare-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aproar-cloudflare-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cloudflare

      - name: Check JavaScript
        run: npm run check
        working-directory: cloudflare

      - name: Run tests
        run: npm test
        working-directory: cloudflare

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to publish this Worker."
            exit 1
          fi

      - name: Deploy to the existing APROAR Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: cloudflare
