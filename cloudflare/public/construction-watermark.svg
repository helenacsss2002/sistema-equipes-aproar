<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" aria-hidden="true">
  <!-- Ilustração de fundo: skyline arquitetônico delicado, sem repetição. -->
  <defs>
    <linearGradient id="towerShade" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dce5ef" stop-opacity=".28"/>
      <stop offset="1" stop-color="#d4e0ec" stop-opacity=".09"/>
    </linearGradient>
    <linearGradient id="sideShade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#dae6f1" stop-opacity=".22"/>
      <stop offset="1" stop-color="#e5ecf3" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="fadeUpper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white"/>
      <stop offset=".6" stop-color="white" stop-opacity=".64"/>
      <stop offset="1" stop-color="white" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="fadeLower" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".38" stop-color="white" stop-opacity=".28"/>
      <stop offset="1" stop-color="white" stop-opacity=".86"/>
    </linearGradient>
    <mask id="upper"><rect width="1600" height="710" fill="url(#fadeUpper)"/></mask>
    <mask id="lower"><rect y="550" width="1600" height="430" fill="url(#fadeLower)"/></mask>
    <pattern id="glass" width="41" height="55" patternUnits="userSpaceOnUse">
      <path d="M0 0V55M41 0V55M0 0H41M0 55H41" stroke="#a7bdcf" stroke-width="1" opacity=".23" fill="none"/>
      <path d="M8 9H33V47H8Z" fill="#dce6ef" opacity=".13" stroke="#afc3d5" stroke-width=".65"/>
    </pattern>
    <pattern id="frame" width="78" height="56" patternUnits="userSpaceOnUse">
      <path d="M0 0H78M0 0V56M78 0V56M0 56H78" fill="none" stroke="#aac0d3" stroke-width="1.15" opacity=".50"/>
    </pattern>
  </defs>

  <!-- Prédios altos, vistos em perspectiva, semelhantes a uma marca-d'água. -->
  <g mask="url(#upper)" stroke="#b7c9d9" stroke-width="1.15" stroke-linejoin="round">
