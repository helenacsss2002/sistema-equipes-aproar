      <path d="M881 137V590M809 268 881 228 970 271M809 366 881 322 970 371M809 471 881 428 970 475" fill="none"/>
    </g>
    <!-- Estrutura em concreto do edifício em construção à direita -->
    <g opacity=".37" stroke-width="1.65">
      <path d="M1035 175 1142 122 1258 171V633H1035Z" fill="#dfE8f1" fill-opacity=".12"/>
      <path d="M1142 122V584M1035 175 1142 122 1258 171M1035 252 1142 200 1258 254M1035 333 1142 281 1258 334M1035 414 1142 362 1258 415M1035 495 1142 443 1258 497M1035 575 1142 525 1258 577M1061 167V620M1112 141V603M1188 141V610M1234 164V621" fill="none"/>
