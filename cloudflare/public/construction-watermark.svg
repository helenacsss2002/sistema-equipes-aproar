      <path d="M436 84V516M340 247 436 191 545 253M340 352 436 298 545 363M340 459 436 404 545 469" fill="none"/>
    </g>
    <g opacity=".40">
      <path d="M570 114 681 49 790 113V607H570Z" fill="url(#towerShade)"/>
      <path d="M570 114 681 49 681 560 570 607Z" fill="url(#sideShade)"/>
      <path d="M681 49 790 113V607L681 560Z" fill="url(#glass)"/>
      <path d="M681 49V560M570 214 681 147 790 214M570 308 681 240 790 308M570 411 681 345 790 411M570 516 681 446 790 516" fill="none"/>
