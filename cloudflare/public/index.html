<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APROAR | Gestão de Equipes</title>
  <style>
:root {
  --navy: #0b1f3a;
  --navy-2: #102b4d;
  --blue: #2563eb;
  --blue-2: #1d4ed8;
  --sky: #eaf2ff;
  --bg: #f4f7fb;
  --panel: #ffffff;
  --text: #182235;
  --muted: #6f7f96;
  --line: #e2e8f0;
  --success: #17803d;
  --success-bg: #eaf8ef;
  --warning: #ad6b00;
  --warning-bg: #fff6dd;
  --danger: #c23b3b;
  --danger-bg: #fff0f0;
  --shadow: 0 12px 35px rgba(15, 35, 63, 0.08);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--text); background: var(--bg); }
button, select, input, textarea { font: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }
.mobile-only { display: none; }

.login-shell { min-height: 100vh; display: grid; place-items: center; padding: 32px; background: radial-gradient(circle at 75% 12%, #d8e7ff 0, transparent 28%), linear-gradient(135deg, #07182e 0 38%, #0c2a50 38% 56%, #f5f8fc 56%); }
.login-card { width: min(520px, 100%); background: rgba(255,255,255,.98); border: 1px solid rgba(255,255,255,.55); border-radius: 6px; padding: 34px; box-shadow: 0 24px 70px rgba(0,0,0,.22); }
.brand-lockup, .sidebar-brand { display: flex; gap: 12px; align-items: center; }
.brand-mark { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 4px; background: var(--blue); color: white; font-weight: 800; font-size: 24px; }
.brand-mark.small { width: 38px; height: 38px; border-radius: 4px; font-size: 20px; }
.brand-name { font-weight: 900; letter-spacing: .08em; font-size: 22px; color: var(--navy); }
.brand-name.compact { color: #fff; font-size: 18px; }
.brand-subtitle { color: var(--muted); font-size: 11px; letter-spacing: .12em; font-weight: 700; }
.brand-subtitle.compact { color: #8ca5c1; font-size: 9px; }
.login-copy { margin: 34px 0 24px; }
.eyebrow { font-size: 11px; letter-spacing: .13em; font-weight: 800; color: #6f86a4; text-transform: uppercase; }
h1 { margin: 8px 0 10px; font-size: clamp(28px, 4vw, 40px); line-height: 1.08; }
p { color: var(--muted); }
.field-label { display: block; font-size: 12px; font-weight: 800; color: #43536b; margin: 15px 0 7px; }
.control { width: 100%; border: 1px solid #d8e0ea; background: white; border-radius: 4px; padding: 11px 12px; color: var(--text); outline: none; }
.control:focus { border-color: #86abff; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
textarea.control { min-height: 88px; resize: vertical; }
.btn { border: 0; border-radius: 4px; padding: 10px 14px; font-weight: 800; transition: .15s ease; }
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--blue); color: white; }
.btn-primary:hover { background: var(--blue-2); }
.btn-secondary { color: var(--navy); background: #eef3fa; }
.btn-ghost { background: transparent; color: #cbd9e9; border: 1px solid #294767; }
.btn-block { width: 100%; margin-top: 14px; }
.login-note { margin: 14px 0 0; font-size: 12px; }
.login-profile-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 9px; margin-top: 8px; }
.profile-choice { border: 1px solid #d8e0ea; background: #fbfcfe; color: #43536b; border-radius: 4px; padding: 11px 10px; font-weight: 800; font-size: 12px; text-align: center; transition: .15s ease; }
.profile-choice:hover { border-color: #9db8ef; background: #f5f8ff; }
.profile-choice.active { border-color: var(--blue); background: #eaf2ff; color: #184da8; box-shadow: 0 0 0 2px rgba(37,99,235,.08); }
.role-badge { display: inline-flex; align-items: center; border-radius: 4px; padding: 5px 9px; font-size: 10px; font-weight: 900; background: #eaf2ff; color: #225bbd; }
.placeholder-list { display: grid; gap: 10px; }
.placeholder-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 12px 13px; background: #fbfcfe; }
.placeholder-item strong { font-size: 12px; color: var(--navy); }
.placeholder-item small { color: var(--muted); }

.app-shell { min-height: 100vh; display: grid; grid-template-columns: 230px 1fr; }
.sidebar { position: sticky; top: 0; height: 100vh; background: linear-gradient(180deg, #0a1f38 0%, #081a30 100%); color: white; padding: 22px 16px; display: flex; flex-direction: column; z-index: 20; }
.sidebar-brand { padding: 4px 6px 24px; border-bottom: 1px solid rgba(255,255,255,.08); }
.side-nav { overflow-y:auto; min-height:0; display: grid; gap: 7px; padding: 22px 0; }
.nav-item { display: flex; gap: 12px; align-items: center; border: 0; background: transparent; color: #c6d4e5; border-radius: 4px; padding: 11px 12px; text-align: left; font-weight: 700; }
.nav-item span { width: 22px; text-align: center; color: #8ca5c1; }
.nav-item:hover, .nav-item.active { background: #2563eb; color: white; }
.nav-item.active span { color: white; }
.sidebar-footer { margin-top: auto; }
.user-chip { display: flex; align-items: center; gap: 10px; padding: 12px 6px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: #203f61; display: grid; place-items: center; font-weight: 800; }
.user-name { font-size: 13px; font-weight: 800; }
.user-role { font-size: 11px; color: #8fa5bd; }

.main-shell { min-width: 0; }
.topbar { height: 78px; padding: 0 28px; background: white; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
.topbar-title { font-size: 20px; font-weight: 900; color: var(--navy); margin-top: 2px; }
.topbar-actions { display: flex; gap: 10px; align-items: center; }
.today-chip { border: 1px solid var(--line); padding: 9px 12px; border-radius: 4px; background: #fafcff; font-size: 12px; color: #5d6e86; font-weight: 700; }
.icon-btn { border: 0; background: #edf2f8; width: 40px; height: 40px; border-radius: 4px; }

.main-content { padding: 26px 28px 40px; max-width: 1500px; margin: 0 auto; }
.page-head { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 20px; }
.page-head h2 { margin: 4px 0; font-size: 25px; color: var(--navy); }
.page-head p { margin: 0; font-size: 13px; }
.grid { display: grid; gap: 16px; }
.grid-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.card { background: white; border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 6px 20px rgba(15,35,63,.04); }
.card-pad { padding: 18px; }
.metric { padding: 18px; min-height: 108px; }
.metric-label { font-size: 11px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; color: #6d7e96; }
.metric-value { margin-top: 10px; font-size: 28px; font-weight: 900; color: var(--navy); }
.metric-note { margin-top: 4px; font-size: 11px; color: #8a98aa; }
.section { margin-top: 22px; }
.section-title { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px; }
.section-title h3 { margin: 0; font-size: 17px; color: var(--navy); }
.section-title p { margin: 3px 0 0; font-size: 12px; }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form-grid .full { grid-column: 1 / -1; }
.checkbox-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.check-card { display: flex; gap: 9px; align-items: center; border: 1px solid var(--line); border-radius: 4px; padding: 10px; background: #fbfcfe; }
.check-card input { accent-color: var(--blue); }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; background: white; }
table { border-collapse: collapse; width: 100%; min-width: 760px; }
th { text-align: left; background: #f6f8fb; color: #63748b; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; padding: 11px 12px; border-bottom: 1px solid var(--line); }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); font-size: 12px; vertical-align: top; }
tr:last-child td { border-bottom: 0; }

.badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 4px; padding: 5px 8px; font-size: 10px; font-weight: 900; white-space: nowrap; }
.badge.success { background: var(--success-bg); color: var(--success); }
.badge.warning { background: var(--warning-bg); color: var(--warning); }
.badge.danger { background: var(--danger-bg); color: var(--danger); }
.badge.info { background: var(--sky); color: #225bbd; }
.empty { padding: 26px; text-align: center; color: #7a8ca4; }
.notice { border-radius: 4px; padding: 13px 14px; font-size: 12px; line-height: 1.5; }
.notice.info { background: #eef5ff; color: #355b94; border: 1px solid #d8e8ff; }
.notice.warning { background: var(--warning-bg); color: #80550f; border: 1px solid #f0dfae; }
.notice.success { background: var(--success-bg); color: #24663b; border: 1px solid #cfead8; }
.inline-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.link-btn { border: 0; background: transparent; color: var(--blue); font-weight: 800; padding: 0; }

.person-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1.4fr; gap: 8px; align-items: end; padding: 12px 0; border-bottom: 1px solid var(--line); }
.person-row:last-child { border-bottom: 0; }
.person-name { font-size: 12px; font-weight: 800; align-self: center; }
.small-label { display: block; font-size: 10px; font-weight: 800; color: #7b8ba1; margin-bottom: 5px; }

.tabs { display: inline-flex; gap: 4px; background: #eaf0f7; border-radius: 4px; padding: 4px; }
.tab-btn { border: 0; background: transparent; border-radius: 3px; padding: 8px 12px; font-weight: 800; color: #62748c; }
.tab-btn.active { background: white; color: var(--navy); box-shadow: 0 2px 8px rgba(15,35,63,.08); }

.toast { position: fixed; top: 18px; right: 18px; z-index: 100; min-width: 260px; max-width: 420px; padding: 12px 14px; border-radius: 4px; background: #0f2c4d; color: white; box-shadow: var(--shadow); transform: translateY(-20px); opacity: 0; pointer-events: none; transition: .2s; font-size: 13px; font-weight: 700; }
.toast.show { transform: translateY(0); opacity: 1; }

@media (max-width: 1100px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .checkbox-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
}

@media (max-width: 820px) {
  .mobile-only { display: inline-grid; place-items: center; }
  .app-shell { display: block; }
  .sidebar { position: fixed; left: -248px; width: 230px; transition: left .2s ease; box-shadow: 10px 0 30px rgba(0,0,0,.2); }
  .sidebar.open { left: 0; }
  .topbar { padding: 0 16px; gap: 10px; }
  .topbar-actions .btn-secondary { display: none; }
  .today-chip { display: none; }
  .main-content { padding: 18px 14px 32px; }
  .page-head { align-items: flex-start; flex-direction: column; }
  .grid-4, .grid-3, .grid-2, .form-grid { grid-template-columns: 1fr; }
  .form-grid .full { grid-column: auto; }
  .checkbox-grid { grid-template-columns: 1fr; }
  .person-row { grid-template-columns: 1fr; border: 1px solid var(--line); border-radius: 4px; padding: 12px; margin-bottom: 10px; }
  .person-row + .person-row { margin-top: 8px; }
  .login-shell { padding: 16px; background: linear-gradient(180deg, #0a1f38 0 28%, #f4f7fb 28%); }
  .login-card { padding: 24px; }
  .login-profile-grid { grid-template-columns: 1fr; }
}

.side-group {font-size:10px;font-weight:800;letter-spacing:.12em;color:#8198b5;margin:10px 12px 2px}.tabs {flex-wrap:wrap}.sidebar-footer {flex-shrink:0}.sub-panel {margin-top:16px}@media print {.sidebar,.topbar,.page-head button,.tabs,.form-actions {display:none!important}.app-shell {display:block}.main-content {padding:0}table {min-width:0}.card {box-shadow:none}}
.brand-mark { background: #fff; padding: 3px; border: 1px solid #e2e8f0; overflow: hidden; }
.brand-mark img { display: block; width: 100%; height: 100%; object-fit: contain; }
/* Barra discreta e arrastável no menu lateral. */
.side-nav { overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: transparent transparent; min-width: 0; width: 100%; }
.side-nav::-webkit-scrollbar { width: 6px; height: 0; }
.side-nav::-webkit-scrollbar-track { background: transparent; }
.side-nav::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
.sidebar:hover .side-nav { scrollbar-color: #294460 transparent; }
.sidebar:hover .side-nav::-webkit-scrollbar-thumb { background: #294460; }
.sidebar:hover .side-nav::-webkit-scrollbar-thumb:hover { background: #3b5876; }
.side-nav::-webkit-scrollbar-button { display: none; }
.nav-item { min-width: 0; width: 100%; }
.nav-item span { flex-shrink: 0; }
.table-wrap { scrollbar-width: thin; scrollbar-color: #b7c4d5 transparent; }
.table-wrap::-webkit-scrollbar { height: 5px; width: 5px; }
.table-wrap::-webkit-scrollbar-track { background: transparent; }
.table-wrap::-webkit-scrollbar-thumb { background: #b7c4d5; border-radius: 3px; }

.login-shell { background: #f4f7fb; padding: 24px; }
.login-card { width: min(480px,100%); padding:28px; border:1px solid var(--line); border-radius:6px; box-shadow:0 14px 40px rgba(15,35,63,.08); }
.login-card .brand-name {letter-spacing:-.03em;font-size:25px;}
.login-card .brand-subtitle {letter-spacing:0;font-weight:400;font-size:11px; margin-top:6px;}
.login-card .brand-lockup { margin-bottom:22px; }
.password-wrap {display:flex;position:relative;}
.password-wrap input {padding-right:48px;}
.password-eye {position:absolute;right:1px;top:1px;bottom:1px;width:40px;background:#eef2f7;border:0;color:#51657f;border-radius:0 4px 4px 0;cursor:pointer;}
.login-error {color:var(--danger);font-size:12px;margin:8px 0 0;min-height:16px;}
.login-shortcuts {display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
.btn-outline {background:white;border:1px solid var(--line);color:#425774;font-weight:500;}
.supervisor-layout {display:block;}

/* Tipografia e cantos suaves */
html, body { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; line-height: 1.45; }
button, select, input, textarea { font-family: inherit; }
.card, .login-card { border-radius: 10px; }
.btn, .control, .nav-item, .tab-btn, .profile-choice { border-radius: 7px; }
.check-card, .person-card, .team-list-item, .more-services, .table-wrap, .notice, .placeholder-item { border-radius: 8px; }
.retro-person-list .check-card, .rect-list .check-card { border-radius: 7px; }
.portal-hero { border-radius: 12px; }
.portal-metric, .portal-date, .today-chip { border-radius: 9px; }
.portal-hero > img, .brand-mark, .brand-mark.small { border-radius: 7px; }
.password-eye { border-radius: 0 7px 7px 0; }
.tabs, .icon-btn, .toast { border-radius: 8px; }
h1, h2, h3, .topbar-title { font-weight: 700; letter-spacing: -.025em; line-height: 1.2; }
.page-head h2 { font-size: 26px; font-weight: 700; }
.section-title h3 { font-size: 18px; font-weight: 650; }
.brand-name, .user-name, .person-name { font-weight: 700; }
.btn, .tab-btn, .nav-item { font-weight: 600; }
.nav-item { font-size: 14px; }
.field-label { font-size: 12px; font-weight: 600; letter-spacing: .01em; }
.control { font-size: 14px; line-height: 1.4; }
.page-head p, .section-title p { font-size: 13px; line-height: 1.6; }
.metric-label { font-weight: 600; letter-spacing: .04em; }
.metric-value { font-size: 29px; font-weight: 700; letter-spacing: -.03em; }
.metric-note, .small-label { font-size: 12px; }
.eyebrow, .side-group { font-weight: 600; letter-spacing: .09em; }

.person-name { font-size: 14px; line-height: 1.45; }

.convocation-fields .control {width:100%;}
@media(max-width:480px){.convocation-fields {grid-template-columns:1fr;}}

/* APROAR — acabamento visual corporativo */
:root {--navy:#162d49;--navy-2:#203e5d;--blue:#2867b2;--blue-2:#205694;--sky:#edf4fc;--bg:#f3f5f8;--text:#24364b;--muted:#66788e;--line:#dde5ee;--shadow:0 8px 28px rgba(22,45,73,.07);}
body {font-size:14px;}
p {line-height:1.6;}
